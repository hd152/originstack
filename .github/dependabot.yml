version: 2
updates:
  # requirements.txt + the optional requirements-*.txt files
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # numpy 2.5+ requires Python 3.12; CI and users still run 3.11 (#102).
      # Drop this once 3.11 support ends.
      - dependency-name: "numpy"
        versions: [">=2.5"]

  # ext/astro_native's Cargo.toml
  - package-ecosystem: "cargo"
    directory: "/ext/astro_native"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"

  # actions used in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
