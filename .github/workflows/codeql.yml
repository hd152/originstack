name: CodeQL

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Catches newly-published CodeQL query updates against unchanged code.
    - cron: '30 4 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # build-mode: none for both -- CodeQL's Rust extractor does not support "manual"
        # (only "none" is valid for rust; "autobuild"/"manual" are compiled-language options
        # that don't apply to it), so ext/astro_native is analyzed without being built.
        language: [ python, rust ]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
