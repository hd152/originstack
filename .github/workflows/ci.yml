name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff==0.16.3

      - name: Style lint (ruff)
        run: ruff check --output-format=github .

      - name: Project-convention lint
        run: python tools/lint_conventions.py --github

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit bandit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Security lint (bandit)
        run: bandit -r src/ -ll -q

      - name: Run tests
        run: pytest -q

      - name: Smoke run (synthetic)
        run: |
          python tools/create_synthetic.py
          python originstack.py -d synthetic_data -o ci_synthetic_stack.fits --debayer-method malvar --white-balance grayworld --stack-method median

      - name: Upload synthetic stack artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci_synthetic_stack_py${{ matrix.python-version }}_${{ github.run_id }}
          path: ci_synthetic_stack.fits
          if-no-files-found: warn
          retention-days: 7
