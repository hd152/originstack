name: CI

on:
  push:
    # develop is included because main's branch protection requires these checks to have
    # already passed on a commit's SHA before it can be pushed there; since main is updated by
    # fast-forwarding develop (no PR), the commit needs its CI run to happen on develop first.
    branches: [ main, master, develop ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff==0.16.3

      - name: Style lint (ruff)
        run: ruff check --output-format=github .

      - name: Project-convention lint
        run: python tools/lint_conventions.py --github

  # Builds the Rust crate and runs the kernel-parity suite against it on its own
  # (a required check; the `test` jobs also build the crate and run the whole
  # suite, test_native.py included, against it).
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/astro_native

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-native-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-native-

      - name: Install deps + build astro_native
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist maturin
          cd ext/astro_native
          maturin build --release
          pip install --force-reinstall --no-deps target/wheels/astro_native-*.whl

      # Correctness + suspicious lints only (style/complexity are left alone). redundant_locals is
      # allowed: `let p = p;` inside a closure deliberately captures the whole Send wrapper
      # (edition-2021 closures would otherwise capture the raw-pointer field).
      - name: Clippy (correctness)
        run: cd ext/astro_native && cargo clippy --release -- -D clippy::correctness -D clippy::suspicious -A clippy::redundant_locals

      - name: Native kernel parity tests
        run: pytest -q -n auto tests/test_native.py

  # The optional `gpu` feature (wgpu; --gpu-coadd) is not in any released wheel, so the default
  # jobs never compile it. Build it on all three platforms (clippy: the repo's correctness gate
  # for the whole crate, and no warning at all in the gpu modules, which the older code would
  # fail). The runners have no GPU; Linux also runs tests/test_gpu_coadd.py on Mesa's software
  # Vulkan driver (lavapipe, admitted by ORIGINSTACK_GPU_ALLOW_SOFTWARE) so the kernels execute.
  gpu-build:
    name: gpu feature (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/astro_native
          key: gpu

      - name: Clippy (gpu feature)
        shell: bash
        working-directory: ext/astro_native
        run: |
          cargo clippy --release --features gpu -- -D clippy::correctness -D clippy::suspicious -A clippy::redundant_locals
          # The crate has older style warnings; the gpu modules must have none.
          cargo clippy --release --features gpu --message-format=short 2>&1 | tee clippy.txt
          if grep -E 'src[/\]gpu' clippy.txt; then echo "::error::clippy warnings in the gpu modules"; exit 1; fi

  gpu-test:
    name: gpu tests (lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/astro_native
          key: gpu

      - name: Software Vulkan (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools

      - name: Install deps + build astro_native with the gpu feature
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest maturin
          cd ext/astro_native
          maturin build --release --features gpu
          pip install --force-reinstall --no-deps target/wheels/astro_native-*.whl
          python -c "import astro_native; print('astro_native', astro_native.__version__, hasattr(astro_native, 'gpu_coadd_begin'))"

      - name: GPU coadd tests
        env:
          ORIGINSTACK_GPU_ALLOW_SOFTWARE: "1"
        run: |
          vulkaninfo --summary | head -30 || true
          python -c "import astro_native as a; print('adapter:', a.gpu_available(), a.gpu_info())"
          pytest -v -rs --durations=10 tests/test_gpu_coadd.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # The suite runs against the Rust module, as the released app does: without it
      # every kernel took its numpy fallback and the run took ~15 min. The fallbacks
      # stay covered by tests/test_native.py, which compares each kernel with its
      # numpy mirror.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/astro_native

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist pip-audit bandit maturin

      - name: Build astro_native
        run: |
          cd ext/astro_native
          maturin build --release
          pip install --force-reinstall --no-deps target/wheels/astro_native-*.whl
          python -c "import astro_native; print('astro_native', astro_native.__version__)"

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Security lint (bandit)
        run: bandit -r src/ -ll -q

      # The Qt window's tests (tests/test_qt_app.py) run on Qt's offscreen platform: no display,
      # but the Qt libraries still load these system libraries.
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -n auto

      - name: Smoke run (synthetic)
        run: |
          python tools/create_synthetic.py
          python originstack.py -d synthetic_data -o ci_synthetic_stack.fits --debayer-method malvar --white-balance grayworld --stack-method median

      - name: Performance budget (time and peak memory)
        # Catches a slowdown or memory blow-up; wide time margin since runners have fewer cores.
        run: |
          pip install psutil
          python tools/perf_budget.py --time-margin 8

      - name: Upload synthetic stack artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ci_synthetic_stack_py${{ matrix.python-version }}_${{ github.run_id }}
          path: ci_synthetic_stack.fits
          if-no-files-found: warn
          retention-days: 7
