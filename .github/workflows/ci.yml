name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Smoke run (synthetic)
        run: |
          python tools/create_synthetic.py
          python astro_stack.py -d synthetic_data -o ci_synthetic_stack.fits --quality-filter --debayer-method malvar --white-balance grayworld --stack-method median

      - name: Upload synthetic stack artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci_synthetic_stack_py${{ matrix.python-version }}_${{ github.run_id }}
          path: ci_synthetic_stack.fits
          if-no-files-found: warn
          retention-days: 7
