name: CI

on:
  push:
    # develop is included because main's branch protection requires these checks to have
    # already passed on a commit's SHA before it can be pushed there; since main is updated by
    # fast-forwarding develop (no PR), the commit needs its CI run to happen on develop first.
    branches: [ main, master, develop ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff==0.16.3

      - name: Style lint (ruff)
        run: ruff check --output-format=github .

      - name: Project-convention lint
        run: python tools/lint_conventions.py --github

  # Builds the Rust crate and runs the kernel-parity suites against it. The
  # `test` job above deliberately runs without astro_native (numpy-fallback
  # coverage); this job is where `tests/test_native.py` and the native-vs-
  # onnxruntime originvision parity checks actually execute -- otherwise the
  # "native matches the numpy/onnxruntime reference" claim never runs in CI.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/astro_native

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-native-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-native-

      - name: Install deps + build astro_native
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest maturin onnxruntime
          cd ext/astro_native
          maturin build --release
          pip install --force-reinstall --no-deps target/wheels/astro_native-*.whl

      - name: Native kernel + originvision parity tests
        run: pytest -q tests/test_native.py tests/test_originvision.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit bandit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Security lint (bandit)
        run: bandit -r src/ -ll -q

      - name: Run tests
        run: pytest -q

      - name: Smoke run (synthetic)
        run: |
          python tools/create_synthetic.py
          python originstack.py -d synthetic_data -o ci_synthetic_stack.fits --debayer-method malvar --white-balance grayworld --stack-method median

      - name: Upload synthetic stack artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci_synthetic_stack_py${{ matrix.python-version }}_${{ github.run_id }}
          path: ci_synthetic_stack.fits
          if-no-files-found: warn
          retention-days: 7
