name: astro_native wheels

# Builds the astro_native wheels and sdist for PyPI. Nothing is published unless the run is a
# `native-v<version>` tag push (or a manual run with `publish` ticked), and then only through the
# `pypi` environment with trusted publishing (no token stored here). A plain manual run builds,
# smoke-tests and keeps the wheels as workflow artifacts.

on:
  push:
    tags: ['native-v*']
  # Crate or workflow changes build and smoke-test every wheel (never publishes), so a broken
  # Linux or macOS build shows up in the PR rather than at release time.
  pull_request:
    paths:
      - 'ext/astro_native/**'
      - '.github/workflows/native-wheels.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI (needs the `pypi` environment and a trusted publisher)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-x64, os: windows-latest, target: x64}
          - {name: linux-x86_64, os: ubuntu-latest, target: x86_64}
          - {name: macos-arm64, os: macos-latest, target: aarch64}
          - {name: macos-x86_64, os: macos-latest, target: x86_64}
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --manifest-path ext/astro_native/Cargo.toml
          sccache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Install the wheel into a clean environment and import it. The macOS x86_64 wheel is
      # cross-compiled on an arm64 runner and cannot be imported there, so it is not run.
      - name: Smoke test
        if: matrix.name != 'macos-x86_64'
        shell: bash
        run: |
          python -m venv smoke
          if [ -d smoke/Scripts ]; then PY=smoke/Scripts/python; else PY=smoke/bin/python; fi
          $PY -m pip install numpy
          $PY -m pip install --no-index --find-links dist astro_native
          $PY -c "import astro_native; print('astro_native', astro_native.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path ext/astro_native/Cargo.toml

      # A release tag must name the crate version it publishes (native-v0.63.1 <-> Cargo.toml).
      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/native-v')
        shell: bash
        run: |
          crate=$(sed -n 's/^version *= *"\(.*\)"/\1/p' ext/astro_native/Cargo.toml | head -n1)
          tag="${GITHUB_REF_NAME#native-v}"
          echo "crate $crate, tag $tag"
          test "$crate" = "$tag"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/native-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
