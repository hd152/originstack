name: astro_native wheels

# Builds the astro_native wheels and sdist and smoke-tests each wheel in a clean environment, on
# every PR that touches the crate (so a broken Linux or macOS build shows up in the PR) and on a
# manual run. Nothing is published: the crate is not on PyPI (decided 2026-11-09; the app downloads
# bundle their own native module). The wheels are kept as workflow artifacts.

on:
  pull_request:
    paths:
      - 'ext/astro_native/**'
      - '.github/workflows/native-wheels.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-x64, os: windows-latest, target: x64}
          - {name: linux-x86_64, os: ubuntu-latest, target: x86_64}
          - {name: macos-arm64, os: macos-latest, target: aarch64}
          - {name: macos-x86_64, os: macos-latest, target: x86_64}
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --manifest-path ext/astro_native/Cargo.toml
          sccache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Install the wheel into a clean environment and import it. The macOS x86_64 wheel is
      # cross-compiled on an arm64 runner and cannot be imported there, so it is not run.
      - name: Smoke test
        if: matrix.name != 'macos-x86_64'
        shell: bash
        run: |
          python -m venv smoke
          if [ -d smoke/Scripts ]; then PY=smoke/Scripts/python; else PY=smoke/bin/python; fi
          $PY -m pip install numpy
          $PY -m pip install --no-index --find-links dist astro_native
          $PY -c "import astro_native; print('astro_native', astro_native.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path ext/astro_native/Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist
