name: Release (desktop app builds)

on:
  push:
    tags: ['v*']
  # Manual run: builds and verifies the Linux bundle and keeps it as a workflow artifact
  # (nothing is attached to a release). Lets the Linux job be tested without tagging.
  workflow_dispatch:

jobs:
  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/astro_native

      - name: Verify VERSION matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne $ver) { throw "Tag v$tag does not match VERSION file ($ver)" }

      - name: Build
        shell: pwsh
        run: .\packaging\build_windows.ps1 -PythonVersion '3.12'

      - name: Verify packaged exe launches
        shell: pwsh
        run: .\packaging\verify_build.ps1

      # Code signing via SignPath Foundation (free for open source). Optional:
      # runs only once the repo variable SIGNPATH_ORGANIZATION_ID and the secret
      # SIGNPATH_API_TOKEN exist, so releases keep working unsigned until the
      # SignPath application is approved. See packaging/README.md ("Code signing").
      - name: Upload exe for signing
        id: upload-exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: packaging/dist/OriginStack/OriginStack.exe

      - name: Sign exe (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: originstack
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          # SignPath Foundation needs a person to approve every release; the default wait is 10 min
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-exe

      # Swap the signed exe into the onedir and rebuild the zip, so the zip and
      # the installer both ship the signed binary.
      - name: Install signed exe and re-zip
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed-exe -Recurse -Filter OriginStack.exe | Select-Object -First 1
          if (-not $signed) { throw "signed OriginStack.exe not found in signed-exe/" }
          $sig = Get-AuthenticodeSignature $signed.FullName
          if ($sig.Status -ne 'Valid') { throw "signed exe has status $($sig.Status)" }
          Copy-Item $signed.FullName packaging\dist\OriginStack\OriginStack.exe -Force
          $zip = Get-ChildItem "packaging\dist\OriginStack-*-windows-x64.zip" | Select-Object -First 1
          Remove-Item $zip.FullName -Force
          Compress-Archive -Path "packaging\dist\OriginStack\*" -DestinationPath $zip.FullName
          .\packaging\verify_build.ps1

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          .\packaging\build_installer.ps1

      - name: Upload installer for signing
        id: upload-setup
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: packaging/dist/OriginStack-*-setup.exe

      - name: Sign installer (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: originstack
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          # SignPath Foundation needs a person to approve every release; the default wait is 10 min
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-setup

      - name: Install signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed-setup -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $signed) { throw "signed installer not found in signed-setup/" }
          $sig = Get-AuthenticodeSignature $signed.FullName
          if ($sig.Status -ne 'Valid') { throw "signed installer has status $($sig.Status)" }
          Copy-Item $signed.FullName "packaging\dist\$($signed.Name)" -Force

      - name: Verify the installer installs a working app
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          $dir = Join-Path $env:RUNNER_TEMP 'osinst'
          $p = Start-Process ".\packaging\dist\OriginStack-$ver-setup.exe" -Wait -PassThru `
              -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          .\packaging\verify_build.ps1 -ExePath "$dir\OriginStack.exe"

      - name: Attach zip and installer to existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = Get-ChildItem "packaging\dist\OriginStack-*-windows-x64.zip" | Select-Object -First 1
          $setup = Get-ChildItem "packaging\dist\OriginStack-*-setup.exe" | Select-Object -First 1
          gh release upload "${{ github.ref_name }}" $zip.FullName $setup.FullName --clobber

  # Linux bundle: built on the oldest runner still offered so the result runs on any glibc at
  # least as new (Ubuntu 22.04 / Debian 12 / Fedora 36 and later). The Windows job above signs;
  # this one does not (Linux has no equivalent of Authenticode).
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/astro_native

      - name: System packages (Tk runtime for the bundle, virtual display for the check)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtk8.6 libtcl8.6 xvfb
          python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Verify VERSION matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(tr -d '[:space:]' < VERSION)"
          [ "$tag" = "$ver" ] || { echo "Tag v$tag does not match VERSION file ($ver)"; exit 1; }

      - name: Build
        run: bash ./packaging/build_linux.sh

      - name: Verify the bundle runs
        run: bash ./packaging/verify_build.sh

      - name: Keep the bundle as a workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: OriginStack-linux-x64
          path: |
            packaging/dist/OriginStack-*-linux-x64.tar.gz
            packaging/dist/OriginStack-*-linux-x64.tar.gz.sha256

      - name: Attach tarball and checksum to existing GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}"             packaging/dist/OriginStack-*-linux-x64.tar.gz             packaging/dist/OriginStack-*-linux-x64.tar.gz.sha256 --clobber
