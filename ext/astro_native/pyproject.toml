[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "astro_native"
version = "0.6.0"
description = "Native Rust hot-path kernels for OriginStack"
requires-python = ">=3.10"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
features = ["pyo3/extension-module"]
