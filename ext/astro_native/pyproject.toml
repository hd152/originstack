[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "astro_native"
# The version is read from Cargo.toml, so a crate change is bumped in one place (lint rule OS005).
dynamic = ["version"]
description = "Native Rust hot-path kernels for OriginStack (stacking, warp, debayer, filters)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.4.6"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/hd152/originstack"
Source = "https://github.com/hd152/originstack/tree/main/ext/astro_native"
Notes = "https://github.com/hd152/originstack/blob/main/dev-notes/native-kernels.md"

[tool.maturin]
features = ["pyo3/extension-module"]
